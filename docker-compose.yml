version: '3.8'
services:
  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      - api-gateway

  api-gateway:
    build: ./api-gateway
    ports:
      - "3000:3000"
    depends_on:
      - user-service
      - product-service
      - order-service
      - inventory-service

  user-service:
    build: ./user-service
    ports:
      - "3001:3001"

  product-service:
    build: ./product-service
    ports:
      - "3002:3002"

  order-service:
    build: ./order-service
    ports:
      - "3003:3003"

  inventory-service:
    build: ./inventory-service
    ports:
      - "3004:3004"
